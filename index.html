const $=s=>document.querySelector(s), fmt=(n,d=0)=>n==null?'<span class="note">dado indisponível</span>':n.toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const pc=n=>n==null?'<span class="note">dado indisponível</span>':fmt(n,2)+'%';
const cor=p=>D.cores[p]||'#8A96A3', chip=p=>`<span class="chip"><span class="dot" style="background:${cor(p)}"></span>${p}</span>`;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const REG=["Norte","Nordeste","Centro-Oeste","Sudeste","Sul"], UFS=Object.keys(D.uf).sort();
const S={cargo:"geral",uf:"",reg:"",par:""};
const CARGOS=[["geral","Visão geral"],["pres","Presidente"],["gov","Governador"],["sen","Senador"],["fed","Deputado federal"],["est","Deputado estadual"],["sim","Simulador do 2º turno"]];
const inScope=u=>(!S.uf||S.uf===u)&&(!S.reg||D.uf[u][1]===S.reg);
const scopeTxt=()=>S.uf?D.uf[S.uf][0]:(S.reg?"Região "+S.reg:"Brasil");

/* ---------- filtros ---------- */
function setupFilters(){

  $('#fReg').innerHTML='<option value="">Todas</option>'+REG.map(r=>`<option>${r}</option>`).join('');
  $('#fUf').innerHTML='<option value="">Todos</option>'+UFS.map(u=>`<option value="${u}">${u} · ${D.uf[u][0]}</option>`).join('');
  const ps=Object.keys(D.camara).concat(["Brasil da Esperança","União Progressista","PSOL-Rede","PSDB-Cidadania","PRD-Solidariedade"]);
  $('#fPar').innerHTML='<option value="">Todos</option>'+ps.map(p=>`<option>${p}</option>`).join('');
  $('#fReg').onchange=e=>{S.reg=e.target.value;if(S.uf&&S.reg&&D.uf[S.uf][1]!==S.reg)S.uf="";render()};
  $('#fUf').onchange=e=>{S.uf=e.target.value;render()};
  $('#fPar').onchange=e=>{S.par=e.target.value;render()};
  $('#clear').onclick=()=>{S.uf=S.reg=S.par="";render()};
  $('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=d?'light':'dark';render()};
}
const parMatch=p=>{if(!S.par)return true;if(p===S.par)return true;const c=D.camara[p];return !!(c&&c[2]===S.par)};

/* ---------- tabela ordenável com busca ---------- */
const T={};
function table(id,cols,rows,search=true){T[id]={cols,rows,sort:null,dir:1,q:""};
  return `${search?`<input class="search" placeholder="Buscar por nome" aria-label="Buscar na tabela" data-tq="${id}" style="margin-bottom:8px;width:100%;max-width:300px">`:''}<div class="scroll"><table id="${id}"></table></div>`}
function drawTable(id){const t=T[id];if(!t)return;let r=t.rows.filter(x=>!t.q||x.some(c=>String(c&&c.t!==undefined?c.t:c).toLowerCase().includes(t.q)));
  if(t.sort!=null)r=[...r].sort((a,b)=>{let x=a[t.sort],y=b[t.sort];x=x&&x.s!==undefined?x.s:x;y=y&&y.s!==undefined?y.s:y;x=x==null?-Infinity:x;y=y==null?-Infinity:y;return (x>y?1:x<y?-1:0)*t.dir});
  const el=document.getElementById(id);if(!el)return;
  el.innerHTML='<thead><tr>'+t.cols.map((c,i)=>`<th class="${c.n?'n':''}" data-i="${i}" tabindex="0">${c.l}${t.sort===i?(t.dir>0?' ▲':' ▼'):''}</th>`).join('')+'</tr></thead><tbody>'+
   (r.length?r.map(x=>'<tr>'+x.map((c,i)=>`<td class="${t.cols[i].n?'n':''}">${c&&c.h!==undefined?c.h:c}</td>`).join('')+'</tr>').join(''):`<tr><td colspan="${t.cols.length}">Nenhum registro com os filtros atuais. Limpe os filtros para ver tudo.</td></tr>`)+'</tbody>';
  el.querySelectorAll('th').forEach(th=>{const go=()=>{const i=+th.dataset.i;t.dir=t.sort===i?-t.dir:1;t.sort=i;drawTable(id)};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter')go()}})}
document.addEventListener('input',e=>{const id=e.target.dataset&&e.target.dataset.tq;if(id){T[id].q=e.target.value.toLowerCase();drawTable(id)}});
const cell=(h,s,t)=>({h,s,t:t===undefined?s:t});

/* ---------- mapa em grade (SVG) ---------- */
function mapa(fill,title,tip){const G=D.geo;let a='',b='';
  for(const u of UFS){const d=D.uf[u],on=inScope(u),c=G.c[u],x=G.x[u];
   a+=`<g data-uf="${u}" data-tip="${(tip?tip(u):d[0]).replace(/"/g,'&quot;')}" class="${S.uf===u?'on':''}" tabindex="0" role="button" aria-label="${d[0]}"><path d="${G.p[u]}" fill="${fill(u)}" opacity="${on?1:.2}"/></g>`;
   b+=x?`<line x1="${c[0]}" y1="${c[1]}" x2="${x[0]-(x[0]>c[0]?9:0)}" y2="${x[1]-4}"/><text class="x" x="${x[0]}" y="${x[1]}" text-anchor="middle">${u}</text>`:`<text x="${c[0]}" y="${c[1]+4}" text-anchor="middle">${u}</text>`}
  return `<div class="map"><svg viewBox="${G.vb}" role="img" aria-label="${title}">${a}${b}</svg></div>`}
function bindMap(){const t=$('#tip');document.querySelectorAll('.map g').forEach(g=>{const go=()=>{t.style.display='none';S.uf=S.uf===g.dataset.uf?"":g.dataset.uf;S.reg="";render()};g.onclick=go;g.onkeydown=e=>{if(e.key==='Enter')go()};
  g.onmousemove=e=>{t.innerHTML=g.dataset.tip;t.style.display='block';t.style.left=Math.min(e.clientX+14,innerWidth-250)+'px';t.style.top=(e.clientY+14)+'px'};g.onmouseleave=()=>t.style.display='none'})}
const mix=(hex,a)=>{const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;return `rgba(${r},${g},${b},${a})`};

/* ---------- agregação presidencial ---------- */
function presAgg(){let f=0,l=0,val=0;for(const u of UFS)if(inScope(u)){const d=D.uf[u];f+=d[4];l+=d[6];val+=d[4]/(d[5]/100)}
  if(!S.uf&&!S.reg)return{f:D.presidente[0].v,l:D.presidente[1].v,fp:47.03,lp:45.16};
  return{f,l,fp:f/val*100,lp:l/val*100}}
function tug(){const a=presAgg(),o=100-a.fp-a.lp;
  $('#tug').innerHTML=`<div class="names"><div><div class="big" style="color:var(--A)">${fmt(a.fp,2)}%</div><div class="who">Flávio Bolsonaro (PL) <span class="note">${fmt(a.f)} votos</span></div></div>
   <div style="text-align:right"><div class="big" style="color:var(--B)">${fmt(a.lp,2)}%</div><div class="who"><span class="note">${fmt(a.l)} votos</span> Lula (PT)</div></div></div>
   <div class="bar" aria-hidden="true"><span style="width:${a.fp}%;background:var(--A)"></span><span style="width:${o}%;background:var(--other)"></span><span style="width:${a.lp}%;background:var(--B)"></span></div>
   <div class="mid"><i></i><b>50% dos votos válidos · ${scopeTxt()} · demais candidatos: ${fmt(o,2)}%</b></div>`}

/* ---------- gráficos ---------- */
function chart(id,cfg){const c=document.getElementById(id);if(!c)return;if(!window.Chart){c.parentElement.innerHTML='<p class="note">O gráfico não carregou (biblioteca indisponível). Os mesmos números estão na tabela.</p>';return}
  Chart.defaults.color=css('--muted');Chart.defaults.borderColor=css('--line');Chart.defaults.font.family='Archivo, sans-serif';charts.push(new Chart(c,cfg))}

/* ---------- visões ---------- */
function vGeral(){const n=D.nacional,t=n.t2022,dl=(a,b)=>{const d=a-b;return `<span class="d">${d>=0?'+':''}${fmt(d,2)} p.p. sobre 2022</span>`};
  const g=Object.entries(D.gov).filter(([u])=>inScope(u)),el=g.filter(x=>x[1].e).length,t2=g.length-el;
  return `<h2>Visão geral</h2><p class="sub">Indicadores nacionais do 1º turno e situação das disputas em ${scopeTxt()}.</p>
  <div class="kpis">
   <div class="kpi"><div class="v">${fmt(n.comparecimento,2)}%</div><div class="l">Comparecimento nacional</div></div>
   <div class="kpi"><div class="v">${fmt(n.abstencao,2)}%</div><div class="l">Abstenção</div>${dl(n.abstencao,t.abstencao)}</div>
   <div class="kpi"><div class="v">${fmt(n.brancos.p,2)}%</div><div class="l">Brancos (${fmt(n.brancos.v)})</div>${dl(n.brancos.p,t.brancos)}</div>
   <div class="kpi"><div class="v">${fmt(n.nulos.p,2)}%</div><div class="l">Nulos (${fmt(n.nulos.v)})</div>${dl(n.nulos.p,t.nulos)}</div>
   <div class="kpi" style="border-left-color:var(--A)"><div class="v">${el}</div><div class="l">Governadores eleitos no 1º turno em ${scopeTxt()}</div></div>
   <div class="kpi" style="border-left-color:var(--warn)"><div class="v">${t2}</div><div class="l">Disputas de governador no 2º turno</div></div>
  </div>
  <div class="grid g2"><div class="panel"><h3>O que os números mostram</h3><ul class="ins">
   <li>A diferença entre os dois primeiros foi de 2.224.965 votos, ou 1,87 ponto percentual dos válidos.</li>
   <li>Os dez candidatos eliminados somaram 7,81% dos votos válidos, mais de quatro vezes a diferença entre os finalistas.</li>
   <li>Flávio liderou em 14 estados e no DF; Lula, em 12 estados. Minas Gerais e Tocantins mudaram de líder em relação ao 1º turno de 2022.</li>
   <li>No Amapá, a diferença foi de 225 votos (45,71% a 45,67%).</li>
   <li>O PL elegeu 121 deputados federais e 19 senadores, os maiores números entre os partidos nas duas Casas.</li>
   <li>20 estados definiram o governador no 1º turno; seis estados e o DF votam de novo em 25 de outubro.</li></ul></div>
  <div class="panel"><h3>Líder para presidente por estado</h3>${mapaPres()}<p class="note">Toque em um estado para filtrar todo o painel.</p></div></div>`}
function mapaPres(){return mapa(u=>{const d=D.uf[u],m=Math.abs(d[5]-d[7]);return mix(d[5]>d[7]?'#24479E':'#C9222E',Math.min(1,.45+m/60))},"Mapa do líder para presidente por estado",u=>{const d=D.uf[u];return `<strong>${d[0]}</strong><br>Flávio ${fmt(d[5],2)}% · Lula ${fmt(d[7],2)}%<br>Margem: ${fmt(Math.abs(d[5]-d[7]),2)} p.p.`})+
  `<div class="legend"><span class="chip"><span class="dot" style="background:#24479E"></span>Flávio Bolsonaro (PL)</span><span class="chip"><span class="dot" style="background:#C9222E"></span>Lula (PT)</span><span>Cor mais forte indica margem maior</span></div>`}

function vPres(){const n=D.nacional.t2022,ufs=UFS.filter(inScope);
  const rows=D.presidente.filter(c=>parMatch(c.p)).map(c=>[c.n,cell(chip(c.p),c.p),cell(fmt(c.v),c.v),cell(pc(c.pc),c.pc),cell(`<span class="tag ${c.s==='2º turno'?'t2':''}">${c.s}</span>`,c.s)]);
  const urows=ufs.map(u=>{const d=D.uf[u],lid=d[5]>d[7]?"PL":"PT";return [cell(`${u} · ${d[0]}`,d[0]),d[1],cell(fmt(d[4]),d[4]),cell(pc(d[5]),d[5]),cell(fmt(d[6]),d[6]),cell(pc(d[7]),d[7]),cell(fmt(Math.abs(d[5]-d[7]),2)+' p.p.',Math.abs(d[5]-d[7])),cell(chip(lid),lid),cell(chip(d[8])+(d[8]!==lid?' <span class="tag t2">mudou</span>':''),d[8])]});
  const reg=REG.map(r=>{let f=0,l=0,v=0;for(const u of UFS)if(D.uf[u][1]===r){const d=D.uf[u];f+=d[4];l+=d[6];v+=d[4]/(d[5]/100)}return[r,f/v*100,l/v*100]});
  return `<h2>Presidente</h2><p class="sub">Resultado nacional com 100% das seções totalizadas. A barra do topo acompanha o filtro: ${scopeTxt()}.</p>
  <div class="grid g2"><div class="panel"><h3>Candidatos (resultado nacional)</h3>${table('tPres',[{l:"Candidato"},{l:"Partido"},{l:"Votos",n:1},{l:"% válidos",n:1},{l:"Situação"}],rows)}
   <p class="note">Votos absolutos dos seis últimos colocados não foram localizados na coleta.</p></div>
  <div class="panel"><h3>Líder por estado</h3>${mapaPres()}</div></div>
  <div class="grid g2"><div class="panel"><h3>Comparação com o 1º turno de 2022</h3>
   <div class="scroll"><table><thead><tr><th>Indicador</th><th class="n">2022</th><th class="n">2026</th><th class="n">Variação</th></tr></thead><tbody>
   <tr><td>Candidato do PT (Lula nos dois anos)</td><td class="n">${pc(n.PT)}</td><td class="n">45,16%</td><td class="n">${fmt(45.16-n.PT,2)} p.p.</td></tr>
   <tr><td>Candidato do PL (Jair Bolsonaro em 2022, Flávio em 2026)</td><td class="n">${pc(n.PL)}</td><td class="n">47,03%</td><td class="n">+${fmt(47.03-n.PL,2)} p.p.</td></tr>
   <tr><td>Estados e DF liderados pelo PT</td><td class="n">14</td><td class="n">12</td><td class="n">-2</td></tr>
   <tr><td>Estados e DF liderados pelo PL</td><td class="n">13</td><td class="n">15</td><td class="n">+2</td></tr></tbody></table></div>
   <p class="note">Percentuais por estado de 2022 não foram incluídos; a tabela abaixo indica apenas o partido líder naquele ano.</p></div>
  <div class="panel"><h3>Desempenho por região</h3><div class="scroll"><table><thead><tr><th>Região</th><th class="n">Flávio</th><th class="n">Lula</th><th>Líder</th></tr></thead><tbody>
   ${reg.map(r=>`<tr style="${S.reg&&S.reg!==r[0]?'opacity:.4':''}"><td>${r[0]}</td><td class="n">${pc(r[1])}</td><td class="n">${pc(r[2])}</td><td>${chip(r[1]>r[2]?'PL':'PT')}</td></tr>`).join('')}</tbody></table></div>
   <p class="note">Calculado neste painel a partir dos votos por estado; não inclui votos no exterior.</p></div></div>
  <div class="panel"><h3>Votação por estado em ${scopeTxt()}</h3><div class="chartbox" style="height:${Math.max(160,ufs.length*24+70)}px"><canvas id="cUf"></canvas></div>
   ${table('tUf',[{l:"Estado"},{l:"Região"},{l:"Flávio",n:1},{l:"%",n:1},{l:"Lula",n:1},{l:"%",n:1},{l:"Margem",n:1},{l:"Líder 2026"},{l:"Líder 2022"}],urows)}</div>`}
function aPres(){const ufs=UFS.filter(inScope).sort((a,b)=>(D.uf[b][5]-D.uf[b][7])-(D.uf[a][5]-D.uf[a][7]));
  chart('cUf',{type:'bar',data:{labels:ufs,datasets:[{label:'Flávio Bolsonaro (PL)',data:ufs.map(u=>D.uf[u][5]),backgroundColor:css('--A')},{label:'Demais',data:ufs.map(u=>+(100-D.uf[u][5]-D.uf[u][7]).toFixed(2)),backgroundColor:css('--other')},{label:'Lula (PT)',data:ufs.map(u=>D.uf[u][7]),backgroundColor:css('--B')}]},
   options:{indexAxis:'y',maintainAspectRatio:false,scales:{x:{stacked:true,max:100,ticks:{callback:v=>v+'%'}},y:{stacked:true}},plugins:{tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${fmt(c.raw,2)}%`}}}}})}

function vGov(){const list=UFS.filter(inScope).map(u=>[u,D.gov[u]]).filter(([u,g])=>!S.par||(g.e?parMatch(g.e[1]):g.t2.some(c=>parMatch(c[1]))));
  const rows=list.map(([u,g])=>g.e?[cell(`${u} · ${D.uf[u][0]}`,D.uf[u][0]),g.e[0]+(g.re?' <span class="tag">reeleito(a)</span>':''),cell(chip(g.e[1]),g.e[1]),cell(pc(g.e[2]),g.e[2]),cell('<span class="tag">Eleito no 1º turno</span>',"1"),cell(g.seg?`${g.seg[0]} (${g.seg[1]}) ${g.seg[2]!=null?fmt(g.seg[2],2)+'%':''}`:'<span class="note">dado indisponível</span>',g.seg?g.seg[0]:"")]
   :[cell(`${u} · ${D.uf[u][0]}`,D.uf[u][0]),g.t2[0][0],cell(chip(g.t2[0][1]),g.t2[0][1]),cell(pc(g.t2[0][2]),g.t2[0][2]),cell('<span class="tag t2">2º turno</span>',"2"),cell(`${g.t2[1][0]} (${g.t2[1][1]}) ${fmt(g.t2[1][2],2)}%`,g.t2[1][0])]);

    <div class="note">${g.t2[0][0]} (${g.t2[0][1]}) ${fmt(g.t2[0][2],2)}% · demais ${fmt(100-g.t2[0][2]-g.t2[1][2],2)}% · ${g.t2[1][0]} (${g.t2[1][1]}) ${fmt(g.t2[1][2],2)}%</div>${g.nota?`<div class="flag">${g.nota}</div>`:''}</div>`).join(''):'<p class="note">Nenhuma disputa de 2º turno neste recorte.</p>'}

function vSen(){const rows=[];UFS.filter(inScope).forEach(u=>D.sen[u].forEach(s=>{if(parMatch(s[1]))rows.push([s[0],cell(chip(s[1]),s[1]),cell(`${u} · ${D.uf[u][0]}`,D.uf[u][0]),D.uf[u][1],cell(s[2]!=null?pc(s[2]):'<span class="note">dado indisponível</span>',s[2]),'<span class="tag">Eleito(a)</span>'])}));

function simCalc(){const s=D.sim,V1=s.A+s.B+s.g.reduce((a,g)=>a+g.v,0),BN1=D.nacional.brancos.v+D.nacional.nulos.v,C1=V1+BN1,E=C1/(D.nacional.comparecimento/100);
  let A=s.A,B=s.B,U=0;for(const g of s.g){const [a,b]=SIM.t[g.k];A+=g.v*a/100;B+=g.v*b/100;U+=g.v*(100-a-b)/100}
  if(SIM.auto){const r=(BN1+U)/C1*100;SIM.br=r*D.nacional.brancos.v/BN1;SIM.nu=r*D.nacional.nulos.v/BN1}
  const C2=E*(1-SIM.abst/100),V2=C2*(1-(SIM.br+SIM.nu)/100),dl=V2-(A+B);let fa,fb;
  if(dl>0){fa=A+dl*SIM.q/100;fb=B+dl*(1-SIM.q/100)}else{fa=A/(A+B)*V2;fb=B/(A+B)*V2}
  return{fa,fb,pa:fa/V2*100,pb:fb/V2*100,V2,dl,U,E}}
